name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 9 * * *"   # after the nightly Claude routine has pushed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: IFPA discovery
        env:
          IFPA_API_KEY: ${{ secrets.IFPA_API_KEY }}
        run: |
          if [ -z "$IFPA_API_KEY" ]; then echo "::warning::IFPA_API_KEY not set; keeping the committed ifpa_upcoming.json"; exit 0; fi
          python scripts/discover.py
      - name: Re-verify (drops editions that have ended)
        run: python scripts/verify.py
      - name: Build site
        run: python scripts/build.py
      - name: Commit refreshed data
        run: |
          git config user.name "pinball-tournaments-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ifpa_upcoming.json data/state.json
          git diff --cached --quiet || (git commit -m "IFPA refresh $(date -u +%F)" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
